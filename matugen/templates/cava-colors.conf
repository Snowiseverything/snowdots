########################################################################
##  SnowDots - Cava Matugen Config                               Version: v1.0.0    ##
##  Generated by matugen — colors adapt to wallpaper                  ##
########################################################################

[general]
framerate = 60

[input]
method = pulse
source = auto

[output]
method = ncurses
style = stereo

[color]
gradient = 1
gradient_count = 8

# Tertiary deep → Tertiary → Tertiary light → Secondary →
# Secondary light → Primary deep → Primary → Primary light
gradient_color_1 = '{{colors.tertiary_container.default.hex}}'
gradient_color_2 = '{{colors.tertiary.default.hex}}'
gradient_color_3 = '{{colors.tertiary_fixed.default.hex}}'
gradient_color_4 = '{{colors.secondary.default.hex}}'
gradient_color_5 = '{{colors.secondary_fixed.default.hex}}'
gradient_color_6 = '{{colors.primary_container.default.hex}}'
gradient_color_7 = '{{colors.primary.default.hex}}'
gradient_color_8 = '{{colors.primary_fixed.default.hex}}'

background = '{{colors.surface.default.hex}}'
foreground = '{{colors.on_surface.default.hex}}'

[smoothing]
noise_reduction = 85
monstercat = 1
waves = 0
gravity = 120

[eq]
1 = 0.8
2 = 0.9
3 = 1.0
4 = 1.1
5 = 1.2
