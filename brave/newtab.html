<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>New Tab</title>
<link rel="stylesheet" href="/theme.css">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  background: var(--md-sys-color-background);
  color: var(--md-sys-color-on-background);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem;
}

#greeting { font-size: 1rem; color: var(--md-sys-color-on-surface-variant); margin-bottom: 0.5rem; opacity: 0.8; }

#clock { font-size: 5rem; font-weight: 300; letter-spacing: 0.05em; line-height: 1; margin-bottom: 0.25rem; color: var(--md-sys-color-on-background); }

#date { font-size: 1.2rem; color: var(--md-sys-color-on-surface-variant); margin-bottom: 3rem; }

#search-form { width: 100%; max-width: 560px; margin-bottom: 2.5rem; }
#search-form input {
  width: 100%; padding: 1rem 1.25rem;
  border: 1px solid var(--md-sys-color-outline);
  border-radius: 12px;
  background: var(--md-sys-color-surface-variant);
  color: var(--md-sys-color-on-surface-variant);
  font-size: 1.1rem; outline: none;
  transition: border-color 0.2s;
}
#search-form input:focus { border-color: var(--md-sys-color-primary); }
#search-form input::placeholder { color: var(--md-sys-color-outline); }

/* Shortcuts */
#shortcuts { display: flex; gap: 1.5rem; margin-top: 1rem; flex-wrap: wrap; justify-content: center; max-width: 640px; position: relative; }

.shortcut {
  display: flex; flex-direction: column; align-items: center; gap: 0.4rem;
  text-decoration: none; color: var(--md-sys-color-on-background);
  transition: transform 0.3s cubic-bezier(.34,1.56,.64,1), color 0.2s;
  min-width: 64px; position: relative;
}
.shortcut:hover { transform: translateY(-4px) scale(1.1); color: var(--md-sys-color-primary); }
.shortcut svg { width: 32px; height: 32px; fill: var(--md-sys-color-on-surface-variant); transition: fill 0.2s, transform 0.3s cubic-bezier(.34,1.56,.64,1); }
.shortcut:hover svg { fill: var(--md-sys-color-primary); transform: scale(1.15); }
.shortcut span { font-size: 0.8rem; color: var(--md-sys-color-on-surface-variant); text-align: center; max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Edit mode */
.edit-mode .shortcut { cursor: pointer; }
.shortcut .edit-actions { display: none; position: absolute; top: -8px; right: -8px; gap: 2px; }
.edit-mode .shortcut .edit-actions { display: flex; }
.shortcut .edit-actions button {
  width: 22px; height: 22px; border-radius: 50%; border: none;
  background: var(--md-sys-color-primary-container);
  color: var(--md-sys-color-on-primary-container);
  cursor: pointer; font-size: 11px; display: flex; align-items: center; justify-content: center;
}
.shortcut .edit-actions .del { background: var(--md-sys-color-error); color: var(--md-sys-color-on-error); }

.edit-mode .add-shortcut-btn {
  display: flex; flex-direction: column; align-items: center; gap: 0.4rem;
  cursor: pointer; min-width: 64px; opacity: 0.5; transition: opacity 0.2s;
}
.edit-mode .add-shortcut-btn:hover { opacity: 1; }
.edit-mode .add-shortcut-btn .plus {
  width: 32px; height: 32px; border-radius: 8px; border: 1px dashed var(--md-sys-color-outline);
  display: flex; align-items: center; justify-content: center;
  color: var(--md-sys-color-on-surface-variant); font-size: 1.2rem;
}
.edit-mode .add-shortcut-btn span { font-size: 0.8rem; color: var(--md-sys-color-on-surface-variant); }
.add-shortcut-btn { display: none; }

/* Edit dialog */
#edit-dialog {
  display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
  background: var(--md-sys-color-surface-container); border: 1px solid var(--md-sys-color-outline-variant);
  border-radius: 12px; padding: 1.5rem; z-index: 200; width: 340px;
}
#edit-dialog.open { display: block; }
#edit-dialog h3 { margin-bottom: 1rem; font-size: 1rem; color: var(--md-sys-color-on-surface); }
#edit-dialog label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--md-sys-color-on-surface-variant); margin-bottom: 0.3rem; }
#edit-dialog input, #edit-dialog select {
  width: 100%; padding: 0.55rem 0.75rem; border: 1px solid var(--md-sys-color-outline);
  border-radius: 8px; background: var(--md-sys-color-surface-variant);
  color: var(--md-sys-color-on-surface-variant); font-size: 0.9rem; outline: none; margin-bottom: 0.75rem;
}
#edit-dialog input:focus, #edit-dialog select:focus { border-color: var(--md-sys-color-primary); }
#edit-dialog .dialog-actions { display: flex; gap: 0.5rem; justify-content: flex-end; }
#edit-dialog button {
  padding: 0.5rem 1rem; border-radius: 8px; border: none; cursor: pointer; font-size: 0.9rem;
}
#edit-dialog .save { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); }
#edit-dialog .cancel { background: var(--md-sys-color-surface-variant); color: var(--md-sys-color-on-surface-variant); }

/* Settings button */
#settings-btn {
  position: fixed; bottom: 1.5rem; right: 1.5rem; width: 40px; height: 40px;
  border-radius: 50%; border: none; background: var(--md-sys-color-surface-variant);
  color: var(--md-sys-color-on-surface-variant); cursor: pointer; z-index: 10;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s, transform 0.3s;
}
#settings-btn:hover { background: var(--md-sys-color-primary-container); color: var(--md-sys-color-primary); }
#settings-btn.open { transform: rotate(60deg); }

/* Edit toggle button */
#edit-btn {
  position: fixed; bottom: 1.5rem; right: 5rem; width: 40px; height: 40px;
  border-radius: 50%; border: none; background: var(--md-sys-color-surface-variant);
  color: var(--md-sys-color-on-surface-variant); cursor: pointer; z-index: 10;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s;
}
#edit-btn:hover, #edit-btn.active { background: var(--md-sys-color-primary-container); color: var(--md-sys-color-primary); }

/* Settings panel */
#settings-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 99; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
#settings-overlay.open { opacity: 1; pointer-events: auto; }
#settings-panel {
  position: fixed; top: 0; right: -400px; width: 400px; height: 100%;
  background: var(--md-sys-color-surface-container); border-left: 1px solid var(--md-sys-color-outline-variant);
  z-index: 100; padding: 1.5rem; overflow-y: auto; transition: right 0.3s ease;
}
#settings-panel.open { right: 0; }
#settings-panel h2 { font-size: 1.2rem; font-weight: 600; margin-bottom: 1rem; color: var(--md-sys-color-on-surface); }
#settings-panel .section { margin-bottom: 1.25rem; }
#settings-panel .section > label {
  display: block; font-size: 0.8rem; font-weight: 600; color: var(--md-sys-color-on-surface-variant);
  margin-bottom: 0.3rem; text-transform: uppercase; letter-spacing: 0.05em;
}
#settings-panel input[type="text"], #settings-panel select, #settings-panel textarea {
  width: 100%; padding: 0.55rem 0.75rem; border: 1px solid var(--md-sys-color-outline);
  border-radius: 8px; background: var(--md-sys-color-surface-variant);
  color: var(--md-sys-color-on-surface-variant); font-size: 0.9rem; outline: none;
}
#settings-panel textarea { resize: vertical; min-height: 120px; font-family: monospace; font-size: 0.8rem; }
#settings-panel input:focus, #settings-panel select:focus, #settings-panel textarea:focus { border-color: var(--md-sys-color-primary); }

/* Toggle switch */
.toggle-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.5rem; }
.toggle-row label { margin-bottom: 0; text-transform: none; letter-spacing: 0; font-size: 0.9rem; cursor: pointer; }
.tgl { position: relative; width: 44px; height: 24px; cursor: pointer; flex-shrink: 0; }
.tgl input { display: none; }
.tgl .slider { position: absolute; inset: 0; background: var(--md-sys-color-outline); border-radius: 12px; transition: 0.2s; }
.tgl .slider::before { content: ''; position: absolute; width: 20px; height: 20px; left: 2px; top: 2px; background: var(--md-sys-color-surface); border-radius: 50%; transition: 0.2s; }
.tgl input:checked + .slider { background: var(--md-sys-color-primary); }
.tgl input:checked + .slider::before { transform: translateX(20px); background: var(--md-sys-color-on-primary); }

/* Widgets */
#widgets { margin-top: 0.5rem; font-size: 0.85rem; color: var(--md-sys-color-on-surface-variant); opacity: 0.7; transition: opacity 0.3s; }
#widgets:hover { opacity: 1; }
#widgets .widget { margin-bottom: 0.5rem; padding: 0.5rem 1rem; background: var(--md-sys-color-surface-variant); border-radius: 8px; display: inline-block; margin-right: 0.5rem; }
#widgets .widget.error { color: var(--md-sys-color-error); }
</style>
</head>
<body>

<div id="greeting"></div>
<div id="clock"></div>
<div id="date"></div>

<form id="search-form" autocomplete="off">
  <input type="text" id="q" placeholder="Search..." autofocus>
</form>

<div id="widgets"></div>

<div id="shortcuts"></div>

<button id="edit-btn" title="Edit shortcuts">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/>
  </svg>
</button>

<button id="settings-btn" title="Settings">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
  </svg>
</button>

<!-- Edit dialog -->
<div id="edit-dialog">
  <h3 id="edit-dialog-title">Add Shortcut</h3>
  <label>Name</label><input type="text" id="edit-name" placeholder="Site name">
  <label>URL</label><input type="text" id="edit-url" placeholder="https://...">
  <label>Icon</label><select id="edit-icon"></select>
  <div class="dialog-actions">
    <button class="cancel">Cancel</button>
    <button class="save">Save</button>
  </div>
</div>

<!-- Settings -->
<div id="settings-overlay"></div>
<div id="settings-panel">
  <h2>Settings</h2>

  <div class="section">
    <label>Greeting (empty = auto)</label>
    <input type="text" id="set-greeting" placeholder="Good evening">
  </div>

  <div class="section toggle-row">
    <label>Show clock</label>
    <label class="tgl"><input type="checkbox" id="set-clock" checked><span class="slider"></span></label>
  </div>

  <div class="section toggle-row">
    <label>Show search</label>
    <label class="tgl"><input type="checkbox" id="set-search" checked><span class="slider"></span></label>
  </div>

  <div class="section">
    <label>Search Engine</label>
    <select id="set-engine">
      <option value="https://search.brave.com/search?q=%s">Brave</option>
      <option value="https://www.google.com/search?q=%s">Google</option>
      <option value="https://duckduckgo.com/?q=%s">DuckDuckGo</option>
      <option value="https://www.youtube.com/results?search_query=%s">YouTube</option>
      <option value="https://github.com/search?q=%s">GitHub</option>
    </select>
  </div>

  <div class="section">
    <label>Custom CSS</label>
    <textarea id="set-css" placeholder="/* Custom CSS injected into this page */" spellcheck="false"></textarea>
  </div>

  <div class="section">
    <label>Widget Scripts (JS, comma-separated URLs or inline code)</label>
    <textarea id="set-widgets" placeholder="// Built-in: weather, stocks, custom_js
weather  // fetches weather from wttr.in
stocks   // fetches stock prices
custom_js:fetch('https://api.example.com/data').then(...)" spellcheck="false"></textarea>
  </div>

  <div class="section">
    <label>Quick Shortcuts</label>
    <div id="shortcut-editor"></div>
    <button id="add-shortcut" style="width:100%;padding:0.5rem;border:1px dashed var(--md-sys-color-outline);border-radius:8px;background:transparent;color:var(--md-sys-color-on-surface-variant);cursor:pointer;margin-top:0.25rem;">+ Add Shortcut</button>
  </div>
</div>

  home: '<svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>',
  code: '<svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>',
  book: '<svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5Z"/></svg>',
  cloud: '<svg viewBox="0 0 24 24"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>',
};
const ICON_LABELS = { github:'GitHub', reddit:'Reddit', youtube:'YouTube', gmail:'Gmail', tailscale:'Tailscale', maps:'Maps', discord:'Discord', spotify:'Spotify', twitch:'Twitch', netflix:'Netflix', link:'Link', folder:'Folder', home:'Home', code:'Code', book:'Book', cloud:'Cloud' };
const ICON_SELECT_OPTS = Object.entries(ICON_LABELS).map(([k,v]) => `<option value="${k}">${v}</option>`).join('');

/* ── Defaults ── */
const DEFAULTS = {
  greeting: '',
  showClock: true,
  showSearch: true,
  engine: 'https://search.brave.com/search?q=%s',
  customCSS: '',
  widgets: '',
  shortcuts: [
    { name:'GitHub', url:'https://github.com', icon:'github' },
    { name:'Reddit', url:'https://reddit.com', icon:'reddit' },
    { name:'YouTube', url:'https://youtube.com', icon:'youtube' },
    { name:'Gmail', url:'https://mail.google.com', icon:'gmail' },
    { name:'Maps', url:'https://maps.google.com', icon:'maps' },
    { name:'Tailscale', url:'https://login.tailscale.com/admin/machines', icon:'tailscale' },
  ]
};

function load() {
  const raw = localStorage.getItem('snow_newtab');
  if (!raw) return JSON.parse(JSON.stringify(DEFAULTS));
  try { return JSON.parse(raw); } catch(e) { return JSON.parse(JSON.stringify(DEFAULTS)); }
}
function save() { localStorage.setItem('snow_newtab', JSON.stringify(cfg)); }

let cfg = load();
let editMode = false;
let editingIdx = -1;

/* ── Render ── */
function renderShortcuts() {
  const div = document.getElementById('shortcuts');
  let html = cfg.shortcuts.map((s,i) =>
    `<a class="shortcut" href="${s.url.replace(/"/g,'&quot;')}" data-idx="${i}">
      <div class="edit-actions">
        <button class="ed" title="Edit" data-idx="${i}"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg></button>
        <button class="del" title="Remove" data-idx="${i}">&times;</button>
      </div>
      ${ICONS[s.icon] || ICONS.link}
      <span>${s.name.replace(/</g,'&lt;')}</span>
    </a>`
  ).join('');
  if (editMode) {
    html += `<div class="add-shortcut-btn" id="add-shortcut-main">
      <div class="plus">+</div><span>Add</span>
    </div>`;
  }
  div.innerHTML = html;
  div.className = 'shortcuts' + (editMode ? ' edit-mode' : '');
}

function renderEditor() {
  const editor = document.getElementById('shortcut-editor');
  if (!editor) return;
  editor.innerHTML = cfg.shortcuts.map((s,i) =>
    `<div class="shortcut-row" data-idx="${i}">
      <input type="text" value="${s.name.replace(/"/g,'&quot;')}" placeholder="Name" data-field="name">
      <input type="text" value="${s.url.replace(/"/g,'&quot;')}" placeholder="URL" data-field="url">
      <select data-field="icon">${ICON_SELECT_OPTS.replace(`value="${s.icon}"`,`value="${s.icon}" selected`)}</select>
      <button class="del-btn" title="Remove">&times;</button>
    </div>`
  );
  document.getElementById('add-shortcut').style.display = '';
}

function apply() {
  document.getElementById('clock').style.display = cfg.showClock ? '' : 'none';
  document.getElementById('date').style.display = cfg.showClock ? '' : 'none';
  document.getElementById('search-form').style.display = cfg.showSearch ? '' : 'none';
  document.getElementById('edit-btn').classList.toggle('active', editMode);
  renderShortcuts();
}

/* ── Edit dialog ── */
function openEditDialog(idx) {
  editingIdx = idx;
  const dlg = document.getElementById('edit-dialog');
  document.getElementById('edit-dialog-title').textContent = idx === -1 ? 'Add Shortcut' : 'Edit Shortcut';
  document.getElementById('edit-icon').innerHTML = ICON_SELECT_OPTS;
  if (idx >= 0) {
    const s = cfg.shortcuts[idx];
    document.getElementById('edit-name').value = s.name;
    document.getElementById('edit-url').value = s.url;
    document.getElementById('edit-icon').value = s.icon;
  } else {
    document.getElementById('edit-name').value = '';
    document.getElementById('edit-url').value = '';
    document.getElementById('edit-icon').value = 'link';
  }
  dlg.classList.add('open');
  document.getElementById('edit-name').focus();
}

function closeEditDialog() {
  document.getElementById('edit-dialog').classList.remove('open');
  editingIdx = -1;
}

function saveEditDialog() {
  const name = document.getElementById('edit-name').value.trim() || 'Link';
  const url = document.getElementById('edit-url').value.trim() || '#';
  const icon = document.getElementById('edit-icon').value;
  if (editingIdx >= 0) {
    cfg.shortcuts[editingIdx] = { name, url, icon };
  } else {
    cfg.shortcuts.push({ name, url, icon });
  }
  save();
  apply();
  closeEditDialog();
}

/* ── Settings sync ── */
function syncToPanel() {
  document.getElementById('set-greeting').value = cfg.greeting;
  document.getElementById('set-clock').checked = cfg.showClock;
  document.getElementById('set-search').checked = cfg.showSearch;
  document.getElementById('set-engine').value = cfg.engine;
  document.getElementById('set-css').value = cfg.customCSS;
  document.getElementById('set-widgets').value = cfg.widgets;
  renderEditor();
}

function syncFromPanel() {
  cfg.greeting = document.getElementById('set-greeting').value;
  cfg.showClock = document.getElementById('set-clock').checked;
  cfg.showSearch = document.getElementById('set-search').checked;
  cfg.engine = document.getElementById('set-engine').value;
  cfg.customCSS = document.getElementById('set-css').value;
  cfg.widgets = document.getElementById('set-widgets').value;

  const rows = document.querySelectorAll('#shortcut-editor .shortcut-row');
  cfg.shortcuts = [];
  rows.forEach(row => {
    const name = row.querySelector('[data-field="name"]').value.trim();
    const url = row.querySelector('[data-field="url"]').value.trim();
    const icon = row.querySelector('[data-field="icon"]').value;
    if (name || url) cfg.shortcuts.push({ name: name || 'Link', url: url || '#', icon });
  });

  // Apply custom CSS
  let styleEl = document.getElementById('custom-css');
  if (!styleEl) {
    styleEl = document.createElement('style');
    styleEl.id = 'custom-css';
    document.head.appendChild(styleEl);
  }
  styleEl.textContent = cfg.customCSS;

  save();
  apply();
  runWidgets();
}

/* ── Panel toggle ── */
function toggleSettings() {
  const panel = document.getElementById('settings-panel');
  const overlay = document.getElementById('settings-overlay');
  const btn = document.getElementById('settings-btn');
  const open = !panel.classList.contains('open');
  panel.classList.toggle('open', open);
  overlay.classList.toggle('open', open);
  btn.classList.toggle('open', open);
  if (open) syncToPanel();
}

/* ── Toggle edit mode ── */
function toggleEdit() {
  editMode = !editMode;
  apply();
}

/* ── Time ── */
function updateTime() {
  const now = new Date();
  const h = now.getHours();
  const greet = cfg.greeting || (h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening');
  document.getElementById('greeting').textContent = greet;
  document.getElementById('clock').textContent = now.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
  document.getElementById('date').textContent = now.toLocaleDateString([], { weekday:'long', month:'long', day:'numeric' });
}

/* ── Widgets ── */
async function fetchWeather() {
  try {
    const r = await fetch('https://wttr.in/?format=%c+%t+%C', { signal: AbortSignal.timeout(5000) });
    if (r.ok) return await r.text();
  } catch(e) {}
  return null;
}

async function fetchStock(symbol) {
  try {
    const r = await fetch(`https://api.stlouisfed.org/fred/series/observations?series_id=${symbol}&api_key=none&file_type=json&limit=1&sort_order=desc&observation_start=2024-01-01`, { signal: AbortSignal.timeout(5000) });
  } catch(e) {}
  return null;
}

async function fetchCrypto(symbol) {
  try {
    const r = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${symbol}&vs_currencies=usd`, { signal: AbortSignal.timeout(5000) });
    if (r.ok) return await r.json();
  } catch(e) {}
  return null;
}

async function runWidgets() {
  const container = document.getElementById('widgets');
  const raw = cfg.widgets.trim();
  if (!raw) { container.innerHTML = ''; return; }

  const lines = raw.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('//'));
  const parts = [];
  const customScripts = [];

  for (const line of lines) {
    if (line === 'weather') {
      parts.push(fetchWeather().then(r => r ? `<span class="widget weather">${r.trim()}</span>` : ''));
    } else if (line.startsWith('stocks')) {
      // stocks:BTC,ETH,SPY
      const syms = (line.split(':')[1] || 'btc,eth').split(',').map(s => s.trim().toLowerCase());
      for (const s of syms) {
        parts.push(fetchCrypto(s).then(d => {
          const p = d && d[s] ? d[s].usd : '?';
          return `<span class="widget stock">${s.toUpperCase()} $${p}</span>`;
        }));
      }
    } else if (line.startsWith('custom_js:')) {
      customScripts.push(line.substring('custom_js:'.length));
    }
  }

  try {
    const results = (await Promise.all(parts)).filter(Boolean);
    container.innerHTML = results.join('');
  } catch(e) {}

  // Run custom script widgets
  for (const script of customScripts) {
    try {
      const fn = new Function('widget', script);
      fn(document.getElementById('widgets'));
    } catch(e) {
      console.warn('Widget script error:', e);
    }
  }
}

/* ── Expose config ── */
window.__newtab_cfg = cfg;
window.__newtab_save = function(newCfg) {
  Object.assign(cfg, newCfg);
  save();
  apply();
};

/* ── Events ── */
document.getElementById('edit-btn').addEventListener('click', toggleEdit);
document.getElementById('settings-btn').addEventListener('click', toggleSettings);
document.getElementById('settings-overlay').addEventListener('click', toggleSettings);

document.getElementById('search-form').addEventListener('submit', e => {
  e.preventDefault();
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  window.location.href = cfg.engine.replace('%s', encodeURIComponent(q));
});

document.getElementById('settings-panel').addEventListener('input', syncFromPanel);
document.getElementById('settings-panel').addEventListener('change', syncFromPanel);

// Settings panel shortcut editor
document.getElementById('add-shortcut').addEventListener('click', () => {
  cfg.shortcuts.push({ name:'', url:'', icon:'link' });
  save();
  renderEditor();
  apply();
});

document.getElementById('shortcut-editor').addEventListener('click', e => {
  if (!e.target.classList.contains('del-btn')) return;
  const row = e.target.closest('.shortcut-row');
  const idx = parseInt(row.dataset.idx);
  if (!isNaN(idx)) {
    cfg.shortcuts.splice(idx, 1);
    save();
    syncFromPanel();
  }
});

// Edit dialog
document.querySelector('#edit-dialog .save').addEventListener('click', saveEditDialog);
document.querySelector('#edit-dialog .cancel').addEventListener('click', closeEditDialog);

// Main shortcuts interactions
document.getElementById('shortcuts').addEventListener('click', e => {
  if (!editMode) return;
  e.preventDefault();

  // Delete button
  if (e.target.closest('.del')) {
    const idx = parseInt(e.target.closest('.del').dataset.idx);
    if (!isNaN(idx) && cfg.shortcuts[idx]) {
      cfg.shortcuts.splice(idx, 1);
      save();
      apply();
    }
    return;
  }

  // Edit button
  if (e.target.closest('.ed')) {
    const idx = parseInt(e.target.closest('.ed').dataset.idx);
    if (!isNaN(idx)) openEditDialog(idx);
    return;
  }

  // Add button
  if (e.target.closest('#add-shortcut-main')) {
    openEditDialog(-1);
    return;
  }
});

/* ── Init ── */
updateTime();
setInterval(updateTime, 1000);
apply();
runWidgets();

// Apply initial custom CSS
if (cfg.customCSS) {
  const styleEl = document.createElement('style');
  styleEl.id = 'custom-css';
  styleEl.textContent = cfg.customCSS;
  document.head.appendChild(styleEl);
}
</script>
</body>
</html>
