<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Injector</title>
  <style>
    body {
      font-family: sans-serif;
      width: 340px;
      padding: 12px;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    #domain {
      font-weight: bold;
      font-size: 14px;
      word-break: break-all;
    }
    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
      cursor: pointer;
    }
    .toggle input {
      display: none;
    }
    .toggle .slider {
      position: absolute;
      inset: 0;
      background: #444;
      border-radius: 12px;
      transition: 0.2s;
    }
    .toggle .slider::before {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      left: 2px;
      top: 2px;
      background: #888;
      border-radius: 50%;
      transition: 0.2s;
    }
    .toggle input:checked + .slider {
      background: #7c4dff;
    }
    .toggle input:checked + .slider::before {
      transform: translateX(20px);
      background: #fff;
    }
    #status {
      font-size: 12px;
      color: #7c4dff;
      min-height: 16px;
    }
    textarea {
      width: 100%;
      height: 120px;
      font-family: monospace;
      font-size: 12px;
      background: #161217;
      color: #e0e0e0;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 6px;
      resize: vertical;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 6px;
      margin-top: 8px;
      background: #7c4dff;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #651fff;
    }
    .hint {
      font-size: 11px;
      color: #888;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="row">
    <span id="domain"></span>
    <label class="toggle">
      <input type="checkbox" id="themeToggle">
      <span class="slider"></span>
    </label>
  </div>
  <div id="status"></div>
  <textarea id="cssInput" placeholder="Enable toggle first to activate auto theme"></textarea>
  <button id="saveBtn">Save Custom Overrides</button>
  <div class="hint">Toggle = auto-theme from local server. Textarea = extra overrides on top.</div>
  <script src="popup.js"></script>
</body>
</html>
