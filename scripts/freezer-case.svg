<svg style="--rgb: #e8e8ee" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" width="600" height="760">
  <style>
    .rgb-fan-ring { stroke: var(--rgb, #0b84da); }
    .rgb-fan-halo { fill: var(--rgb, #0b84da); }
    .rgb-strip { fill: var(--rgb, #0b84da); }
  </style>

  <defs>
    <!-- Case body gradient -->
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f5f7"/>
      <stop offset="100%" stop-color="#d8d8dc"/>
    </linearGradient>
    <!-- Glass gradient -->
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dfe6ee"/>
      <stop offset="45%" stop-color="#c8d2dd"/>
      <stop offset="55%" stop-color="#b9c6d4"/>
      <stop offset="100%" stop-color="#aabacb"/>
    </linearGradient>
    <!-- Fan blade gradient -->
    <linearGradient id="bladeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8e8ea"/>
      <stop offset="100%" stop-color="#c4c4c8"/>
    </linearGradient>
    <!-- RGB glow filter -->
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Soft RGB halo -->
    <filter id="halo" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Ambient shadow -->
  <rect x="20" y="20" width="560" height="720" rx="18" fill="#00000018"/>

  <!-- ============ CASE BODY ============ -->
  <!-- Back panel (darker) -->
  <rect x="60" y="40" width="480" height="700" rx="14" fill="#b9b9c0"/>
  <!-- Main body -->
  <rect x="50" y="30" width="500" height="700" rx="16" fill="url(#bodyGrad)" stroke="#c0c0c6" stroke-width="2"/>

  <!-- Top mesh panel -->
  <rect x="50" y="30" width="500" height="26" rx="12" fill="#e2e2e6"/>
  <g stroke="#cfcfd4" stroke-width="1.5">
    <line x1="70" y1="30" x2="70" y2="56"/>
    <line x1="90" y1="30" x2="90" y2="56"/>
    <line x1="110" y1="30" x2="110" y2="56"/>
    <line x1="130" y1="30" x2="130" y2="56"/>
    <line x1="150" y1="30" x2="150" y2="56"/>
    <line x1="170" y1="30" x2="170" y2="56"/>
    <line x1="190" y1="30" x2="190" y2="56"/>
    <line x1="210" y1="30" x2="210" y2="56"/>
    <line x1="230" y1="30" x2="230" y2="56"/>
    <line x1="250" y1="30" x2="250" y2="56"/>
    <line x1="270" y1="30" x2="270" y2="56"/>
    <line x1="290" y1="30" x2="290" y2="56"/>
    <line x1="310" y1="30" x2="310" y2="56"/>
    <line x1="330" y1="30" x2="330" y2="56"/>
    <line x1="350" y1="30" x2="350" y2="56"/>
    <line x1="370" y1="30" x2="370" y2="56"/>
    <line x1="390" y1="30" x2="390" y2="56"/>
    <line x1="410" y1="30" x2="410" y2="56"/>
    <line x1="430" y1="30" x2="430" y2="56"/>
    <line x1="450" y1="30" x2="450" y2="56"/>
    <line x1="470" y1="30" x2="470" y2="56"/>
    <line x1="490" y1="30" x2="490" y2="56"/>
    <line x1="510" y1="30" x2="510" y2="56"/>
    <line x1="530" y1="30" x2="530" y2="56"/>
  </g>

  <!-- I/O panel strip (front top) -->
  <rect x="50" y="56" width="500" height="40" rx="4" fill="#cfcfd4"/>
  <rect x="60" y="62" width="24" height="14" rx="3" fill="#f2f2f4"/>
  <rect x="60" y="82" width="24" height="8" rx="3" fill="#f2f2f4"/>
  <circle cx="112" cy="70" r="4" fill="#a0a0a8"/>
  <circle cx="128" cy="70" r="4" fill="#a0a0a8"/>

  <!-- RGB strip under I/O (class=rgb-strip) -->
  <rect class="rgb-strip" opacity="0.9" filter="url(#glow)"/>

  <!-- ============ FRONT MESH AREA ============ -->
  <!-- Mesh panel background -->
  <rect x="75" y="110" width="450" height="500" rx="10" fill="#e8e8ec"/>

  <!-- Mesh pattern -->
  <g stroke="#d4d4da" stroke-width="1">
    <line x1="75" y1="130" x2="525" y2="130"/><line x1="75" y1="150" x2="525" y2="150"/>
    <line x1="75" y1="170" x2="525" y2="170"/><line x1="75" y1="190" x2="525" y2="190"/>
    <line x1="75" y1="210" x2="525" y2="210"/><line x1="75" y1="230" x2="525" y2="230"/>
    <line x1="75" y1="250" x2="525" y2="250"/><line x1="75" y1="270" x2="525" y2="270"/>
    <line x1="75" y1="290" x2="525" y2="290"/><line x1="75" y1="310" x2="525" y2="310"/>
    <line x1="75" y1="330" x2="525" y2="330"/><line x1="75" y1="350" x2="525" y2="350"/>
    <line x1="75" y1="370" x2="525" y2="370"/><line x1="75" y1="390" x2="525" y2="390"/>
    <line x1="75" y1="410" x2="525" y2="410"/><line x1="75" y1="430" x2="525" y2="430"/>
    <line x1="75" y1="450" x2="525" y2="450"/><line x1="75" y1="470" x2="525" y2="470"/>
    <line x1="75" y1="490" x2="525" y2="490"/><line x1="75" y1="510" x2="525" y2="510"/>
    <line x1="75" y1="530" x2="525" y2="530"/><line x1="75" y1="550" x2="525" y2="550"/>
    <line x1="75" y1="570" x2="525" y2="570"/><line x1="75" y1="590" x2="525" y2="590"/>
    <line x1="95" y1="110" x2="95" y2="610"/><line x1="115" y1="110" x2="115" y2="610"/>
    <line x1="135" y1="110" x2="135" y2="610"/><line x1="155" y1="110" x2="155" y2="610"/>
    <line x1="175" y1="110" x2="175" y2="610"/><line x1="195" y1="110" x2="195" y2="610"/>
    <line x1="215" y1="110" x2="215" y2="610"/><line x1="235" y1="110" x2="235" y2="610"/>
    <line x1="255" y1="110" x2="255" y2="610"/><line x1="275" y1="110" x2="275" y2="610"/>
    <line x1="295" y1="110" x2="295" y2="610"/><line x1="315" y1="110" x2="315" y2="610"/>
    <line x1="335" y1="110" x2="335" y2="610"/><line x1="355" y1="110" x2="355" y2="610"/>
    <line x1="375" y1="110" x2="375" y2="610"/><line x1="395" y1="110" x2="395" y2="610"/>
    <line x1="415" y1="110" x2="415" y2="610"/><line x1="435" y1="110" x2="435" y2="610"/>
    <line x1="455" y1="110" x2="455" y2="610"/><line x1="475" y1="110" x2="475" y2="610"/>
    <line x1="495" y1="110" x2="495" y2="610"/><line x1="515" y1="110" x2="515" y2="610"/>
  </g>

  <!-- ============ FRONT FANS (3x ARGB 120mm) ============ -->
  <!-- Fan 1 (top) -->
  <g transform="translate(150,140)">
    <circle cx="100" cy="100" r="92" fill="#e0e0e4" stroke="#c8c8ce" stroke-width="2"/>
    <circle class="rgb-fan-ring" stroke-width="10" opacity="0.85" filter="url(#glow)"/>
    <circle class="rgb-fan-halo" opacity="0.22" filter="url(#halo)"/>
    <!-- Blades -->
    <g fill="url(#bladeGrad)">
      <path d="M100 100 L100 30 A70 70 0 0 1 142 52 Z"/>
      <path d="M100 100 L142 52 A70 70 0 0 1 160 105 Z"/>
      <path d="M100 100 L160 105 A70 70 0 0 1 145 160 Z"/>
      <path d="M100 100 L145 160 A70 70 0 0 1 88 165 Z"/>
      <path d="M100 100 L88 165 A70 70 0 0 1 45 132 Z"/>
      <path d="M100 100 L45 132 A70 70 0 0 1 42 75 Z"/>
      <path d="M100 100 L42 75 A70 70 0 0 1 72 40 Z"/>
      <path d="M100 100 L72 40 A70 70 0 0 1 100 30 Z"/>
    </g>
    <circle cx="100" cy="100" r="22" fill="#d6d6da" stroke="#b8b8be" stroke-width="2"/>
  </g>

  <!-- Fan 2 (middle) -->
  <g transform="translate(150,330)">
    <circle cx="100" cy="100" r="92" fill="#e0e0e4" stroke="#c8c8ce" stroke-width="2"/>
    <circle class="rgb-fan-ring" stroke-width="10" opacity="0.85" filter="url(#glow)"/>
    <circle class="rgb-fan-halo" opacity="0.22" filter="url(#halo)"/>
    <g fill="url(#bladeGrad)">
      <path d="M100 100 L100 30 A70 70 0 0 1 142 52 Z"/>
      <path d="M100 100 L142 52 A70 70 0 0 1 160 105 Z"/>
      <path d="M100 100 L160 105 A70 70 0 0 1 145 160 Z"/>
      <path d="M100 100 L145 160 A70 70 0 0 1 88 165 Z"/>
      <path d="M100 100 L88 165 A70 70 0 0 1 45 132 Z"/>
      <path d="M100 100 L45 132 A70 70 0 0 1 42 75 Z"/>
      <path d="M100 100 L42 75 A70 70 0 0 1 72 40 Z"/>
      <path d="M100 100 L72 40 A70 70 0 0 1 100 30 Z"/>
    </g>
    <circle cx="100" cy="100" r="22" fill="#d6d6da" stroke="#b8b8be" stroke-width="2"/>
  </g>

  <!-- Fan 3 (bottom) -->
  <g transform="translate(150,520)">
    <circle cx="100" cy="100" r="92" fill="#e0e0e4" stroke="#c8c8ce" stroke-width="2"/>
    <circle class="rgb-fan-ring" stroke-width="10" opacity="0.85" filter="url(#glow)"/>
    <circle class="rgb-fan-halo" opacity="0.22" filter="url(#halo)"/>
    <g fill="url(#bladeGrad)">
      <path d="M100 100 L100 30 A70 70 0 0 1 142 52 Z"/>
      <path d="M100 100 L142 52 A70 70 0 0 1 160 105 Z"/>
      <path d="M100 100 L160 105 A70 70 0 0 1 145 160 Z"/>
      <path d="M100 100 L145 160 A70 70 0 0 1 88 165 Z"/>
      <path d="M100 100 L88 165 A70 70 0 0 1 45 132 Z"/>
      <path d="M100 100 L45 132 A70 70 0 0 1 42 75 Z"/>
      <path d="M100 100 L42 75 A70 70 0 0 1 72 40 Z"/>
      <path d="M100 100 L72 40 A70 70 0 0 1 100 30 Z"/>
    </g>
    <circle cx="100" cy="100" r="22" fill="#d6d6da" stroke="#b8b8be" stroke-width="2"/>
  </g>

  <!-- ============ SIDE TEMPERED GLASS (right side view) ============ -->
  <!-- Glass panel -->
  <rect x="380" y="120" width="150" height="580" rx="10" fill="url(#glassGrad)" stroke="#9aa8b8" stroke-width="2"/>
  <!-- Glass reflection -->
  <path d="M400 140 L520 300 L520 320 L400 160 Z" fill="#ffffff" opacity="0.25"/>
  <path d="M400 300 L520 460 L520 480 L400 320 Z" fill="#ffffff" opacity="0.12"/>
  <!-- Internal RGB strip behind glass (class=rgb-strip) -->
  <rect class="rgb-strip" opacity="0.8" filter="url(#glow)"/>
  <!-- GPU hint behind glass -->
  <rect x="400" y="430" width="110" height="70" rx="6" fill="#3a3a44"/>
  <rect x="400" y="430" width="110" height="8" fill="#0b84da" opacity="0.7"/>
  <rect x="400" y="446" width="110" height="8" fill="#0b84da" opacity="0.7"/>
  <rect x="400" y="462" width="110" height="8" fill="#0b84da" opacity="0.7"/>
  <rect x="400" y="478" width="110" height="8" fill="#0b84da" opacity="0.7"/>

  <!-- ============ BASE / FEET ============ -->
  <rect x="80" y="708" width="30" height="12" rx="3" fill="#8a8a92"/>
  <rect x="490" y="708" width="30" height="12" rx="3" fill="#8a8a92"/>
  <rect x="285" y="708" width="30" height="12" rx="3" fill="#8a8a92"/>

  <!-- Front RGB bottom strip (class=rgb-strip) -->
  <rect class="rgb-strip" opacity="0.85" filter="url(#glow)"/>
</svg>
